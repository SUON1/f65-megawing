name: Static hygiene

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Evidence boundary: this workflow establishes DOCUMENTATION / STATIC CI only.
# It does not establish host-oracle, target, generated-contract, Xemu, D81,
# SD-transfer, physical-MEGA65, human-acceptance, R0-F, or measured-limit evidence.
jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Evidence exception fail-closed fixtures
        run: python3 -B -m unittest discover -s tools/ci -p 'test_*.py' -v

      - name: Changed-range whitespace and tracked artifact guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 -B tools/ci/static_hygiene.py \
              --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --merge-base
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              empty_tree="$(git hash-object -t tree /dev/null)"
              python3 -B tools/ci/static_hygiene.py \
                --base "$empty_tree" --head "$PUSH_AFTER_SHA"
            else
              python3 -B tools/ci/static_hygiene.py \
                --base "$PUSH_BEFORE_SHA" --head "$PUSH_AFTER_SHA"
            fi
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

      - name: JSON syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          output = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.json"],
              text=False,
          )
          paths = [
              path.decode("utf-8", errors="surrogateescape")
              for path in output.split(b"\0")
              if path
          ]

          for path in paths:
              with Path(path).open("r", encoding="utf-8") as source:
                  json.load(source)
          PY

      - name: Python syntax
        run: |
          python3 - <<'PY'
          import ast
          import subprocess
          import tokenize

          output = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.py"],
              text=False,
          )
          paths = [
              path.decode("utf-8", errors="surrogateescape")
              for path in output.split(b"\0")
              if path
          ]

          for path in paths:
              with tokenize.open(path) as source:
                  ast.parse(source.read(), filename=path)
          PY

      - name: Shell syntax
        run: |
          set -euo pipefail

          while IFS= read -r -d '' path; do
            sh -n "$path"
          done < <(git ls-files -z -- '*.sh')
